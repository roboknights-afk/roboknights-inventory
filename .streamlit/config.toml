# Based on roboknights.in: dark, near-black background, Work Sans typeface.
# The site itself is monochrome, but the student chose to add one brand
# accent on top of it — "knight gold" — because all-grey primary buttons
# looked disabled/generic. Gold shows on primary buttons, focused inputs,
# links, and selection highlights; everything else stays monochrome.
#
# Split into [theme.dark]/[theme.light] (rather than one flat [theme]) so
# Streamlit's own Settings menu offers a real Light/Dark/System switcher
# using OUR colors for both — a single flat [theme] block makes Streamlit
# hide that picker entirely, on the assumption a fully custom theme
# shouldn't fall back to its generic presets. base = "dark" just picks
# which one loads first; a few options (base, fontFaces, baseFontSize,
# baseFontWeight, showSidebarBorder, chart colors) have to stay here at
# the shared top level — Streamlit doesn't allow per-variant overrides
# for those.
#
# Known trade-off: the login/logout gear-splash overlay and the gear
# watermark in app.py can't ask Streamlit which variant the viewer
# currently has selected — that isn't exposed to Python or plain CSS in
# this version. Both fall back to a prefers-color-scheme media query
# instead (the OS/browser's own light-vs-dark signal), which is exactly
# right for anyone on the "System" option and a reasonable default
# otherwise, but won't track someone who explicitly picks Light while
# their OS itself is set to Dark (or vice versa).

# UI refresh, phase 1 (2026-11-13): depth instead of one flat grey. The
# page sits a step darker than cards and inputs, the sidebar a step darker
# again, so cards read as raised without any CSS. Headings are tighter and
# heavier, status colours are tuned to sit with the gold (Streamlit's
# defaults are much more saturated), charts lead with gold, and code and
# numbers get a proper monospace face. Colours only: no layout changed.

[theme]
base = "dark"
font = "Work Sans:https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap"
headingFont = "Work Sans:https://fonts.googleapis.com/css2?family=Work+Sans:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.85rem"
baseFontSize = 16
headingFontSizes = ["2.25rem", "1.6rem", "1.25rem", "1.05rem", "0.95rem", "0.85rem"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
metricValueFontSize = "2rem"
metricValueFontWeight = 600
baseRadius = "14px"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false
# Gold first, then colours that stay distinct from it and from each other.
chartCategoricalColors = ["#E8B33D", "#5BA8E0", "#57C08A", "#E0726B", "#A98BE0", "#E08F4A", "#9A9AA2"]
chartSequentialColors = ["#3A2F14", "#56441A", "#735A20", "#907127", "#AD882E", "#C99E35", "#E8B33D", "#EEC466", "#F3D590", "#F9E7BC"]

[theme.dark]
primaryColor = "#E8B33D"
backgroundColor = "#1A1A1C"
secondaryBackgroundColor = "#262629"
textColor = "#F4F4F5"
linkColor = "#E8B33D"
borderColor = "#35353A"
codeBackgroundColor = "#222225"
dataframeHeaderBackgroundColor = "#222225"
dataframeBorderColor = "#303034"
redColor = "#F0736B"
orangeColor = "#EE9A4D"
yellowColor = "#E8B33D"
greenColor = "#5CC98F"
blueColor = "#62AEEA"
violetColor = "#AE92EA"
grayColor = "#9A9AA2"

[theme.dark.sidebar]
backgroundColor = "#131314"
secondaryBackgroundColor = "#1F1F22"
borderColor = "#2A2A2E"

[theme.light]
primaryColor = "#A8780A"
backgroundColor = "#FBFAF7"
secondaryBackgroundColor = "#F1EFEA"
textColor = "#1C1B19"
linkColor = "#8F6608"
borderColor = "#DFDBD2"
codeBackgroundColor = "#F1EFEA"
dataframeHeaderBackgroundColor = "#F1EFEA"
dataframeBorderColor = "#E4E0D8"
redColor = "#C9423A"
orangeColor = "#C2681A"
yellowColor = "#A8780A"
greenColor = "#23875A"
blueColor = "#2A72B5"
violetColor = "#6E4FC0"
grayColor = "#6B6964"

[theme.light.sidebar]
backgroundColor = "#F3F1EC"
secondaryBackgroundColor = "#E9E6DF"
borderColor = "#DFDBD2"
