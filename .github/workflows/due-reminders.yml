name: Due date reminders

on:
  schedule:
    # PAUSED (2026-10-06): joke of the day. The 2:30 UTC run existed only
    # for that one step, so with the step commented out the schedule is
    # commented out too instead of firing an empty job every morning.
    # To bring it back, uncomment this line AND the step below.
    # 2:30 UTC = 8:00 AM IST — joke of the day
    # - cron: "30 2 * * *"
    # 3:30 UTC = 9:00 AM IST — loan due-date reminders + day-before competition reminders
    - cron: "30 3 * * *"
    # 10:30 UTC = 4:00 PM IST — "how did it go" achievement reminders, competition day itself
    - cron: "30 10 * * *"
    # 14:30 UTC = 8:00 PM IST — the evening check on the day's Discord messages
    - cron: "30 14 * * *"
  workflow_dispatch: # lets us trigger it manually from the Actions tab, for testing

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # requests isn't a transitive dependency of supabase (which uses httpx
      # internally) — needed explicitly since send_due_reminders.py imports
      # it directly for the WhatsApp Cloud API calls.
      - run: pip install supabase python-dotenv requests
      # Manual runs (github.event.schedule is empty) now do three, not four:
      # the joke of the day below is PAUSED (2026-10-06). Uncomment it, and
      # the 2:30 UTC cron line at the top, to turn it back on.
      #
      # Joke of the day (8am IST). Reads the last 24 hours of
      # discord_channel_log for material, but always safe to run even
      # with nothing in there - falls back to a plain robotics joke. See
      # the long comment at the top of send_joke_of_the_day.py for why it
      # never names a real member.
      # - name: Joke of the day (8am IST)
      #   if: github.event.schedule != '30 3 * * *' && github.event.schedule != '30 10 * * *' && github.event.schedule != '30 14 * * *'
      #   run: python send_joke_of_the_day.py
      #   env:
      #     SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      #     SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      #     GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      #     DISCORD_GENERAL_WEBHOOK_URL: ${{ secrets.DISCORD_GENERAL_WEBHOOK_URL }}
      - name: Loan + day-before competition reminders (9am IST)
        if: github.event.schedule != '30 2 * * *' && github.event.schedule != '30 10 * * *' && github.event.schedule != '30 14 * * *'
        run: python send_due_reminders.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Registration-deadline reminders also post, as the bot, in the
          # Exun server's RoboKnights channel and ping this one person.
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_EXUN_CHANNEL_ID: ${{ secrets.DISCORD_EXUN_CHANNEL_ID }}
          REGISTRATION_PING_DISCORD_USER_ID: ${{ secrets.REGISTRATION_PING_DISCORD_USER_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
      - name: Achievement reminders (4pm IST)
        if: github.event.schedule != '30 2 * * *' && github.event.schedule != '30 3 * * *' && github.event.schedule != '30 14 * * *'
        run: python send_achievement_reminders.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
      # The evening check on the club's Discord (8pm IST). Reads the last 24
      # hours of discord_channel_log and emails a report of anything that
      # looks like a personal attack. Reads and reports only - it never
      # replies, deletes, or warns anyone.
      - name: Discord evening check (8pm IST)
        if: github.event.schedule != '30 2 * * *' && github.event.schedule != '30 3 * * *' && github.event.schedule != '30 10 * * *'
        run: python check_discord_messages.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # No Discord webhook and no AUTO_WARN here on purpose: this check
          # never posts to Discord (the automatic-warning mode was removed
          # 2026-10-20). It records flags and emails the report.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
