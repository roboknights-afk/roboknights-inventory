name: Deploy Discord bot

# Moved to a friend's VPS (Cloud on Fire, 2026-09-14) - Hugging Face Spaces
# (previously here) locked its free Docker tier behind a paid plan in July
# 2026, after Railway's trial had already run out and Oracle wanted a card
# for identity verification. See DEPLOY.md for the full survey and why a
# real, paid-but-cheap VPS from someone the student knows won out.
#
# The bot is self-contained (discord_bot/ never imports shared.py), so
# only that folder needs to reach the VPS - not the whole repo. Same
# rsync-over-SSH + systemd --user restart shape as the (never-provisioned)
# Oracle Cloud plan, just pointed at a real box this time.
#
# Needs three repo secrets - see DEPLOY.md's VPS section for where these
# came from:
#   VPS_HOST     - the VPS's public IP
#   VPS_USER     - the SSH username (a dedicated non-root "deploy" user,
#                  created during initial setup - root SSH login is
#                  disabled on this box)
#   VPS_SSH_KEY  - the private half of the key pair generated for this
#                  deploy user, so this can SSH in as it

on:
  push:
    branches: [master]
    # Only the bot's own files - a dashboard-only change doesn't need the
    # bot restarted, and a restart drops its in-memory channel context
    # and re-runs the startup backfill.
    paths:
      - "discord_bot/**"
      - ".github/workflows/deploy-bot.yml"
  workflow_dispatch: # manual trigger from the Actions tab, for testing

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # --exclude='.env': the VPS's real secrets live only in
      # ~/roboknights-bot/.env, created once by hand and never checked
      # into this repo. --delete would normally remove anything on the
      # VPS missing from this sync, but an *excluded* file is left alone
      # unless --delete-excluded is also passed, which it deliberately
      # isn't - so .env survives every deploy untouched.
      #
      # --exclude='venv/' is NOT optional - the venv lives only on the VPS,
      # created once by hand, and was missing from this list on the first
      # real deploy (2026-09-14): --delete saw it absent from discord_bot/
      # and wiped it out from under the RUNNING bot process mid-request,
      # breaking every AI provider call (TLS certs and dynamic imports read
      # from disk at call time, unlike code already loaded into memory,
      # which is why the bot didn't crash outright - just started failing
      # everything that touched the filesystem). Never remove this exclude.
      - name: Sync bot code to the VPS
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            --exclude='.env' --exclude='__pycache__' --exclude='deploy/' --exclude='Dockerfile' --exclude='venv/' \
            discord_bot/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/roboknights-bot/"

      # XDG_RUNTIME_DIR is set automatically in a real login shell but not
      # always in a non-interactive SSH command - exported explicitly so
      # `systemctl --user` can find the running user session that
      # `loginctl enable-linger` (done once during initial setup) keeps
      # alive.
      - name: Install requirements and restart the bot
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
              export XDG_RUNTIME_DIR=/run/user/$(id -u)
              cd ~/roboknights-bot &&
              source venv/bin/activate &&
              pip install -q -r requirements.txt &&
              systemctl --user restart roboknights-bot
            '

      - name: Confirm it is live
        run: |
          sleep 5
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
              export XDG_RUNTIME_DIR=/run/user/$(id -u)
              systemctl --user is-active roboknights-bot
            '
