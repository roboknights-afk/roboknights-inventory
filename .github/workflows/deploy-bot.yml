name: Deploy Discord bot

# Moved to Hugging Face Spaces (2026-09-15) - the Oracle Cloud plan
# (previously here, see git history for that config) needed a card for
# identity verification even on its Always Free tier, which the student
# doesn't have. Hugging Face Spaces' free Docker tier needs no card at
# all (2 vCPU / 16 GB RAM, email signup only) - see DEPLOY.md for the
# full comparison of hosting options and why this one won.
#
# The bot is self-contained (discord_bot/ never imports shared.py), so
# only that folder needs to reach the Space - not the whole repo, and a
# Space is itself a git repo, so this deploys with a plain git push
# rather than needing SSH/rsync like the Oracle plan would have.
#
# Needs two repo secrets - see DEPLOY.md's Hugging Face section for how
# to get each one:
#   HF_TOKEN  - a Hugging Face access token with WRITE access to the Space
#   HF_SPACE  - the Space's id, as "<hf-username>/<space-name>"

on:
  push:
    branches: [master]
    # Only the bot's own files - a dashboard-only change doesn't need the
    # bot restarted, and a restart drops its in-memory channel context
    # and re-runs the startup backfill.
    paths:
      - "discord_bot/**"
      - ".github/workflows/deploy-bot.yml"
  workflow_dispatch: # manual trigger from the Actions tab, for testing

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A Space's git history is its own, separate from this repo's -
      # nothing here needs (or wants) this project's full commit history,
      # secrets, or unrelated folders (deploy/ is Oracle/Pi-specific
      # setup scripts, meaningless inside a Space container). Building a
      # fresh throwaway repo and force-pushing keeps the Space's content
      # exactly equal to discord_bot/ on every deploy, nothing more.
      - name: Mirror discord_bot/ into a fresh repo
        run: |
          rm -rf /tmp/hf-space
          mkdir -p /tmp/hf-space
          cp -r discord_bot/. /tmp/hf-space/
          rm -rf /tmp/hf-space/deploy /tmp/hf-space/__pycache__ /tmp/hf-space/Procfile
          cd /tmp/hf-space
          git init -q -b main
          git config user.email "ci@roboknights.local"
          git config user.name "RoboKnights CI"
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}"

      - name: Push to the Hugging Face Space
        run: |
          cd /tmp/hf-space
          git remote add space "https://ci:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/${{ secrets.HF_SPACE }}"
          git push --force space main
